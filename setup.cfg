[flake8]
ignore =
    W503,
    F811
exclude =
    tests/,
    */migrations/,
    data/,
    venv/,
    env/,
    frontend/
per-file-ignores =
    */settings.py:E501

[isort]
profile = black
line_length = 79
known_third_party = django,djoser,rest_framework,django_filters,drf_extra_fields
known_first_party = api,recipes
known_local_folder = api,recipes
sections = STDLIB,THIRDPARTY,FIRSTPARTY,LOCALFOLDER
skip_glob = */migrations/*,*/venv/*,*/env/*,frontend/*
